services:
  app:
    build: .
    container_name: unitrack-attendance-app
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/attendance
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

  mongo:
    image: mongo:7
    container_name: unitrack-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
